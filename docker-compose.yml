services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: "hermes"
    restart: unless-stopped
    command: gateway run
    ports:
      - "${HERMES_GATEWAY_PORT:-8642}:8642"
    volumes:
      &hermes-volumes
      - ${HERMES_DATA_DIR:-${HOME}/.hermes}:/opt/data
    env_file: &hermes-env-file
      - .env
    environment:
      TZ: ${TZ:-Asia/Taipei}
    # 啟用 browser 自動化時取消註解 (需要至少 2GB RAM)
    # shm_size: "1g"
    networks:
      - hermes-net
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEMORY_LIMIT:-4G}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"

  dashboard:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    container_name: "hermes-dashboard"
    restart: unless-stopped
    command: dashboard --host 0.0.0.0
    ports:
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes: *hermes-volumes
    env_file: *hermes-env-file
    environment:
      TZ: ${TZ:-Asia/Taipei}
      GATEWAY_HEALTH_URL: ${GATEWAY_HEALTH_URL:-http://hermes:8642}
      GATEWAY_HEALTH_TIMEOUT: ${GATEWAY_HEALTH_TIMEOUT:-3}
    networks:
      - hermes-net
    depends_on:
      - hermes

networks:
  hermes-net:
    driver: bridge
