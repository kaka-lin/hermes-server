services:
  hermes:
    build:
      context: .
      args:
        # Pin the upstream base; use latest only for upgrade testing.
        HERMES_VERSION: ${HERMES_VERSION:-v0.23.1}
        # agent-browser lets skills pick a host Chrome per command (--cdp); Hermes itself no longer ships it.
        AGENT_BROWSER_VERSION: ${AGENT_BROWSER_VERSION:-0.26.0}
    # HERMES_VERSION selects both the base and custom image tag.
    image: ${HERMES_IMAGE:-kakalin/hermes-agent}:${HERMES_VERSION:-v0.23.1}
    container_name: "${HERMES_CONTAINER_NAME:-hermes}"
    restart: unless-stopped
    # After SIGTERM the gateway drains running cron jobs and API runs for up to
    # cron_drain_timeout (30s) plus teardown; a shorter grace kills them mid-run.
    stop_grace_period: 45s
    command: [ "bash", "-c", "python3 /opt/data/scripts/cdp_proxy.py & exec hermes gateway run" ]
    # HERMES_BIND_ADDR (e.g. 127.0.0.1) limits the ports to one host address;
    # unset keeps Docker's default of every interface, IPv4 and IPv6.
    ports:
      - "${HERMES_BIND_ADDR:+${HERMES_BIND_ADDR:-}:}${HERMES_GATEWAY_PORT:-8642}:8642"
      - "${HERMES_BIND_ADDR:+${HERMES_BIND_ADDR:-}:}${HERMES_DASHBOARD_PORT:-9119}:9119"
      # Webhook platform of the default profile (WEBHOOK_ENABLED=true in its .env).
      - "${HERMES_BIND_ADDR:+${HERMES_BIND_ADDR:-}:}${HERMES_WEBHOOK_PORT:-8644}:8644"
    volumes:
      - ${HERMES_DATA_DIR:-${HOME}/.hermes}:/opt/data
    # Docker Desktop provides host.docker.internal; this line adds it on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Runtime secrets live in /opt/data/.env; Compose variables come from
    # config/compose.env and config/platforms/<platform>.env.
    environment:
      TZ: ${TZ:-Asia/Taipei}
      # Where cdp_proxy.py forwards CDP connections (the host running Chrome).
      CDP_HOST: ${CDP_HOST:-host.docker.internal}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_CORS_ORIGINS: "${HERMES_API_CORS_ORIGINS:-*}"
      # Remap the container's hermes user to the host user that owns the data dir (needed on
      # Linux; Docker Desktop hides ownership). Empty means no remap.
      HERMES_UID: "${HERMES_UID:-}"
      HERMES_GID: "${HERMES_GID:-}"
      # Dashboard and gateway share one container and one data writer.
      HERMES_DASHBOARD: "${HERMES_DASHBOARD:-1}"
      # Non-loopback dashboards require credentials; override these defaults in /opt/data/.env.
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-hermes}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-hermes_default_secret}"
    # Shared memory for Chromium.
    shm_size: "${HERMES_SHM_SIZE:-1g}"
    # Internal DNS cannot reliably resolve external domains, so force public DNS;
    # otherwise the container loses the internet after the VPN drops (Discord offline,
    # Telegram stuck, LLM timeouts).
    dns:
      - ${HERMES_DNS_PRIMARY:-1.1.1.1}
      - ${HERMES_DNS_SECONDARY:-8.8.8.8}
    # Python's socket/DNS cache can wedge after a VPN switch; probing the internet
    # periodically surfaces an unhealthy state quickly.
    # See docs/troubleshooting/docker-dns-vpn.md
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request as u; u.urlopen(u.Request('${HERMES_HEALTHCHECK_URL:-https://discord.com}', headers={'User-Agent': 'hermes-healthcheck'}), timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - hermes-net
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEMORY_LIMIT:-6G}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"

networks:
  hermes-net:
    driver: bridge
