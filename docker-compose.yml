services:
  hermes:
    build:
      context: .
      args:
        # 上游 base image 版本;預設 pin 穩定 tag,可用 HERMES_VERSION=latest 切到最新測上游
        HERMES_VERSION: ${HERMES_VERSION:-v2026.9.14}
    # 成品 tag 跟 base 版本同名，多個版本可並存；HERMES_VERSION 同時決定 build 與 up 用哪一版
    image: kakalin/hermes-agent:${HERMES_VERSION:-v2026.9.14}
    container_name: "${HERMES_CONTAINER_NAME:-hermes}"
    restart: unless-stopped
    # compose 預設 10 秒就 SIGKILL，gateway 收尾（session/DB 寫回）常不夠，
    # 下次啟動會報 "exited UNCLEANLY"；多給 20 秒。
    stop_grace_period: 30s
    command: [ "bash", "-c", "python3 /opt/data/scripts/cdp_proxy.py & exec hermes gateway run" ]
    ports:
      - "${HERMES_GATEWAY_PORT:-8642}:8642"
      - "${HERMES_DASHBOARD_PORT:-9119}:9119"
    volumes:
      - ${HERMES_DATA_DIR:-${HOME}/.hermes}:/opt/data
    # Hermes runtime config is read from /opt/data/.env, which maps to
    # ${HERMES_DATA_DIR:-${HOME}/.hermes}/.env. Keep this repo's .env for
    # compose-only settings such as ports, limits, image tag, and data path.
    environment:
      TZ: ${TZ:-Asia/Taipei}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${API_SERVER_KEY:-hermes_default_secret}"
      API_SERVER_CORS_ORIGINS: "*"
      # 官方建議:dashboard 以 s6 服務跟 gateway 跑在同一容器,
      # 不要再開第二個容器共用 /opt/data(會撞鎖、並發寫壞 session/memory)。
      # 詳見 https://hermes-agent.nousresearch.com/docs/user-guide/docker
      HERMES_DASHBOARD: "${HERMES_DASHBOARD:-1}"
      # v2026.9.x 起 dashboard 綁 0.0.0.0 一律要過認證，HERMES_DASHBOARD_INSECURE 已失效
      # （沒設帳密會拒絕啟動、被 s6 無限重啟）。這裡用內建的帳密 provider，預設值不安全，務必改。
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-hermes}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-hermes_default_secret}"
    # Playwright/Chromium 共享記憶體；停用 browser tools 時可設為較小值
    shm_size: "${HERMES_SHM_SIZE:-1g}"
    # 內網 DNS 無法穩定解析外部域名，強制使用公共 DNS
    # 避免關閉 VPN 後 container 整個失去外網（Discord 下線 / Telegram 卡死 / LLM timeout）
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Python 底層 Socket/DNS 快取在 VPN 切換後可能卡死；
    # healthcheck 定期探測外網，快速暴露 unhealthy 狀態方便處理
    # 詳見 docs/troubleshooting/docker-dns-vpn.md
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request as u; u.urlopen(u.Request('https://discord.com', headers={'User-Agent': 'hermes-healthcheck'}), timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - hermes-net
    deploy:
      resources:
        limits:
          memory: ${HERMES_MEMORY_LIMIT:-4G}
          cpus: "${HERMES_CPU_LIMIT:-2.0}"

networks:
  hermes-net:
    driver: bridge
